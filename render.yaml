services:
  - type: web
    name: wa-nalizer-api
    rootDir: backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PORT
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
