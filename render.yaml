services:
  - type: web
    name: wa-nalizer-api
    rootDir: backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_REASONING_EFFORT
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: DEEPSEEK_REASONING_EFFORT
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GOOGLE_AI_MODEL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ROOT_USERNAME
        sync: false
      - key: ROOT_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PORT
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SCHEMA
        sync: false
