services:
  - type: web
    name: wa-nalizer-api
    rootDir: backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PORT
        sync: false
